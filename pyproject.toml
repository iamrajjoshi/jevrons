[project]
name = "jevrons"
version = "0.0.0"
description = "Training a neural network whose neurons are frozen Jev evaluations"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.2,<3", "matplotlib>=3.10,<4"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
