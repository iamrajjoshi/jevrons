# Fly.io config for the live demo. Exactly one small machine; it sleeps when idle and wakes on the next visit.
# Fly starts two machines on a first deploy unless told not to, so deploy with --ha=false (see demo/README.md).
# One machine also matters for the budget: the daily spend counter lives on the machine, so two would each allow $9.
app = "jevrons-demo"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    hard_limit = 64

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
