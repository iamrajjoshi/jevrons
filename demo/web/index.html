<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jevrons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
<header class="top">
  <h1>Jevrons</h1>
  <p class="lede" id="lede"></p>
  <p class="status" id="status"></p>
</header>

<main class="layout">
  <aside class="rail">
    <section class="win pad-win">
      <div class="bar"><span>input</span><span id="pad-note">28 × 28 after preprocessing</span></div>
      <div class="pad-wrap">
        <canvas id="pad" width="560" height="560" aria-label="Drawing pad"></canvas>
        <p class="pad-empty" id="pad-empty">Draw a digit</p>
      </div>
      <div class="row">
        <button class="btn" id="clear">Clear</button>
        <button class="btn" id="real">Test digit</button>
        <select id="real-label" class="btn" aria-label="Which test digit"></select>
      </div>
    </section>

    <div class="seen">
      <canvas id="seen" width="28" height="28"></canvas>
      <p id="seen-note"></p>
    </div>

    <section class="bill" aria-live="polite">
      <div class="bill-head"><span>this draw</span><span id="bill-kind">nothing run</span></div>
      <dl>
        <dt>calls</dt><dd id="b-calls">0</dd>
        <dt>input tokens</dt><dd id="b-tokens">0</dd>
        <dt>cost</dt><dd id="b-usd">$0.0000</dd>
        <dt>elapsed</dt><dd id="b-time">0.0 s</dd>
      </dl>
      <p id="b-live"></p>
    </section>
  </aside>

  <section class="stage">
    <div class="controls">
      <label class="field"><span>network</span><select id="task"></select></label>
      <div class="field"><span>neurons</span>
        <div class="seg" id="source">
          <button data-v="live">live Jev</button>
          <button data-v="exact">exact math</button>
        </div>
      </div>
      <button class="toggle" id="compare" role="switch" aria-checked="false">
        <i></i><span>Compare with the network trained on perfect math<small id="compare-cost"></small></span></button>
      <button class="btn primary run" id="run">Run</button>
      <p class="help" id="source-help"></p>
    </div>

    <div class="panels" id="panels"></div>

    <section class="calls" id="calls" hidden>
      <div class="calls-head"><span>calls, sent → answered</span><button class="btn small" id="replay-anim">Replay</button></div>
      <div class="calls-track">
        <svg id="calls-svg"></svg>
        <input type="range" id="calls-range" min="0" max="1000" value="1000" aria-label="Scrub through the run">
      </div>
      <div class="calls-foot"><span>0 s</span><span id="calls-t"></span><span id="calls-end"></span></div>
    </section>
  </section>
</main>

<aside class="drawer win" id="inspector" hidden>
  <div class="bar"><span id="i-title">neuron</span><button class="x" id="i-close" aria-label="Close">close</button></div>
  <div class="i-body" id="i-body"></div>
</aside>

<template id="panel-tpl">
  <article class="panel win">
    <div class="bar"><span class="p-title"></span><span class="p-arch"></span></div>
    <p class="p-notice" hidden></p>
    <div class="net">
      <svg class="wires"></svg>
      <div class="hidden-grid"></div>
      <div class="outs"></div>
      <div class="pred"><span class="pred-big"></span><span class="pred-cap"></span></div>
    </div>
    <div class="p-foot"><span class="p-stats"></span><span class="p-note"></span></div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
